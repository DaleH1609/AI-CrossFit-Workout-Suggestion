<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Phrase Spinner — KOVA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0A0A0A;
    color: #fff;
    font-family: -apple-system, 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .header h1 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .header p { font-size: 12px; color: #9CA3AF; }

  /* ── DEMO AREA ── */
  .demo-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: ns-resize;
  }

  /* The scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #555;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 6px;
    animation: hint-fade 2s ease-in-out infinite;
    user-select: none;
    pointer-events: none;
  }
  .scroll-hint svg { animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }
  @keyframes hint-fade { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

  /* ── THE CAROUSEL ── */
  .scene {
    perspective: 800px;
    perspective-origin: 50% 50%;
    position: relative;
    width: 640px;
    height: 220px;
    flex-shrink: 0;
  }

  .carousel {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    /* JS controls rotateX via --ry */
    transition: transform 0.05s linear;
  }

  .phrase {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    user-select: none;
  }

  .phrase-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #D4AF37;
    margin-bottom: 14px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .phrase-text {
    font-family: 'Georgia', serif;
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 700;
    line-height: 1.15;
    text-align: center;
    color: #fff;
    letter-spacing: -0.01em;
  }

  .phrase-text em {
    font-style: normal;
    color: #D4AF37;
  }

  /* Position each phrase around the Y-axis cylinder */
  /* 3 phrases = 120° apart */
  .phrase-0 { transform: rotateY(0deg)   translateZ(260px); }
  .phrase-1 { transform: rotateY(120deg) translateZ(260px); }
  .phrase-2 { transform: rotateY(240deg) translateZ(260px); }

  /* Side bar showing progress */
  .progress-bar {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .pip {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #333;
    transition: background 0.4s, transform 0.4s;
  }
  .pip.active { background: #D4AF37; transform: scale(1.4); }

  /* Scroll instructions */
  .instructions {
    position: absolute;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .inst-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: #444;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 0.3s;
  }
  .inst-item.active { color: #D4AF37; }
  .inst-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  /* ── OPTIONS PANEL ── */
  .options-panel {
    flex-shrink: 0;
    background: #0D0D0D;
    border-top: 1px solid #1a1a1a;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .opt-label { font-size: 11px; color: #555; letter-spacing: 0.05em; text-transform: uppercase; margin-right: 4px; }
  .opt-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1.5px solid #222;
    background: transparent;
    color: #9CA3AF;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }
  .opt-btn:hover { border-color: #D4AF37; color: #D4AF37; }
  .opt-btn.sel { border-color: #D4AF37; color: #D4AF37; background: rgba(212,175,55,0.08); }
  .sep { width: 1px; height: 28px; background: #1a1a1a; }
</style>
</head>
<body>

<div class="header">
  <h1>Phrase Spinner — scroll demo</h1>
  <p>Scroll (or drag) in the preview area · 3 phrases rotate around a 3D cylinder as you scroll</p>
</div>

<div class="demo-wrap" id="demoWrap">

  <div class="scene">
    <div class="carousel" id="carousel">
      <div class="phrase phrase-0">
        <div class="phrase-label" id="lbl0">01</div>
        <div class="phrase-text">Train <em>Smarter.</em><br>Coach Better.</div>
      </div>
      <div class="phrase phrase-1">
        <div class="phrase-label" id="lbl1">02</div>
        <div class="phrase-text">Your Gym.<br><em>Your Style.</em></div>
      </div>
      <div class="phrase phrase-2">
        <div class="phrase-label" id="lbl2">03</div>
        <div class="phrase-text">Less Planning.<br><em>More Coaching.</em></div>
      </div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="pip active" id="pip0"></div>
    <div class="pip" id="pip1"></div>
    <div class="pip" id="pip2"></div>
  </div>

  <div class="instructions">
    <div class="inst-item active" id="inst0"><span class="inst-dot"></span>Phrase 1</div>
    <div class="inst-item" id="inst1"><span class="inst-dot"></span>Phrase 2</div>
    <div class="inst-item" id="inst2"><span class="inst-dot"></span>Phrase 3</div>
  </div>

  <div class="scroll-hint">
    <svg width="12" height="14" viewBox="0 0 12 14" fill="none">
      <path d="M6 1v9M6 10l-3-3M6 10l3-3" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Scroll here
  </div>
</div>

<div class="options-panel">
  <span class="opt-label">Direction</span>
  <button class="opt-btn sel" id="dirY" onclick="setDir('Y')">Horizontal spin</button>
  <button class="opt-btn" id="dirX" onclick="setDir('X')">Vertical flip</button>
  <div class="sep"></div>
  <span class="opt-label">Speed</span>
  <button class="opt-btn" onclick="setSpeed(0.6)">Slow</button>
  <button class="opt-btn sel" onclick="setSpeed(1)">Normal</button>
  <button class="opt-btn" onclick="setSpeed(1.6)">Fast</button>
  <div class="sep"></div>
  <button class="opt-btn sel" id="btnAutoSpin" onclick="toggleAutoSpin()">↺ Auto-demo</button>
</div>

<script>
  let rotation = 0;        // degrees of Y rotation on the carousel
  let targetRot = 0;
  let autoSpin = true;
  let autoT = 0;
  let spinDir = 'Y';
  let speedMul = 1;
  let dragging = false;
  let lastY = 0;
  const NUM = 3;
  const STEP = 360 / NUM; // 120°

  const carousel = document.getElementById('carousel');
  const wrap = document.getElementById('demoWrap');

  function getActivePhrase() {
    // normalize rotation to 0-360
    let r = ((rotation % 360) + 360) % 360;
    // phrase 0 is at 0°, phrase 1 at 120°, phrase 2 at 240°
    // front is 0°, so active phrase = round(r/120) % 3
    return Math.round(r / STEP) % NUM;
  }

  function updateUI() {
    const active = getActivePhrase();
    for (let i = 0; i < NUM; i++) {
      document.getElementById(`pip${i}`).classList.toggle('active', i === active);
      document.getElementById(`inst${i}`).classList.toggle('active', i === active);
    }

    if (spinDir === 'Y') {
      carousel.style.transform = `rotateY(${-rotation}deg)`;
    } else {
      carousel.style.transform = `rotateX(${-rotation}deg)`;
    }
  }

  // ── Auto-spin demo ────────────────────────────────────────────────────────
  let lastTime = null;
  function autoLoop(ts) {
    if (autoSpin) {
      if (!lastTime) lastTime = ts;
      const dt = ts - lastTime;
      lastTime = ts;
      rotation += (dt / 1000) * 18 * speedMul;
      updateUI();
    } else {
      lastTime = null;
      // smooth to nearest step
      const nearest = Math.round(rotation / STEP) * STEP;
      rotation += (nearest - rotation) * 0.08;
      updateUI();
    }
    requestAnimationFrame(autoLoop);
  }
  requestAnimationFrame(autoLoop);

  // ── Scroll in demo area ───────────────────────────────────────────────────
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    if (autoSpin) { autoSpin = false; document.getElementById('btnAutoSpin').classList.remove('sel'); }
    rotation += e.deltaY * 0.12 * speedMul;
    updateUI();
  }, { passive: false });

  // ── Drag to spin ─────────────────────────────────────────────────────────
  wrap.addEventListener('mousedown', e => { dragging = true; lastY = e.clientY; if (autoSpin) { autoSpin = false; document.getElementById('btnAutoSpin').classList.remove('sel'); } });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dy = e.clientY - lastY;
    rotation += dy * 0.4 * speedMul;
    lastY = e.clientY;
    updateUI();
  });
  window.addEventListener('mouseup', () => { dragging = false; });

  // ── Touch ────────────────────────────────────────────────────────────────
  wrap.addEventListener('touchstart', e => { lastY = e.touches[0].clientY; if (autoSpin) { autoSpin = false; } });
  wrap.addEventListener('touchmove', e => {
    e.preventDefault();
    const dy = e.touches[0].clientY - lastY;
    rotation += dy * 0.4 * speedMul;
    lastY = e.touches[0].clientY;
    updateUI();
  }, { passive: false });

  function setDir(d) {
    spinDir = d;
    document.getElementById('dirY').classList.toggle('sel', d === 'Y');
    document.getElementById('dirX').classList.toggle('sel', d === 'X');
    // swap phrase positions
    const phrases = document.querySelectorAll('.phrase');
    if (d === 'Y') {
      phrases[0].style.transform = `rotateY(0deg)   translateZ(260px)`;
      phrases[1].style.transform = `rotateY(120deg) translateZ(260px)`;
      phrases[2].style.transform = `rotateY(240deg) translateZ(260px)`;
    } else {
      phrases[0].style.transform = `rotateX(0deg)   translateZ(260px)`;
      phrases[1].style.transform = `rotateX(120deg) translateZ(260px)`;
      phrases[2].style.transform = `rotateX(240deg) translateZ(260px)`;
    }
  }

  function setSpeed(s) {
    speedMul = s;
    document.querySelectorAll('.options-panel .opt-btn').forEach(b => {
      if (b.textContent === 'Slow' || b.textContent === 'Normal' || b.textContent === 'Fast') b.classList.remove('sel');
    });
    event.target.classList.add('sel');
  }

  function toggleAutoSpin() {
    autoSpin = !autoSpin;
    document.getElementById('btnAutoSpin').classList.toggle('sel', autoSpin);
  }
</script>
</body>
</html>
